<!DOCTYPE html>
<html>

<head>

    <title>VaultSense AI</title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

<div class="sidebar">

    <h2>VaultSense AI</h2>

    <a href="application.html">1. Application</a>
    <a href="portfolio.html">2. Portfolio Database</a>
    <a href="governance.html">3. Governance & Audit</a>

</div>

<div class="main">

    <h1>Loan Underwriting Application</h1>

    <p class="subtitle">
        Credit risk intake and underwriting workflow.
    </p>

    <div class="card">

        <div class="form-grid">

            <input id="customer_name" placeholder="Customer Name">

            <input id="customer_id" placeholder="Customer ID">

            <input id="age" placeholder="Age">

            <select id="gender">
                <option>Male</option>
                <option>Female</option>
            </select>

            <select id="state">
                <option>MH</option>
                <option>DL</option>
                <option>KA</option>
                <option>GJ</option>
            </select>

            <select id="urban_rural">
                <option>Urban</option>
                <option>Semi_Urban</option>
                <option>Rural</option>
            </select>

            <select id="employment_type">
                <option>Salaried</option>
                <option>Self_Employed</option>
                <option>Business_Owner</option>
                <option>Government</option>
            </select>

            <input id="employment_years" placeholder="Employment Years">

            <input id="income" placeholder="Annual Income">

            <select id="loan_type">
                <option>Home_Loan</option>
                <option>Personal_Loan</option>
                <option>Education_Loan</option>
                <option>Auto_Loan</option>
            </select>

            <input id="loan_amount" placeholder="Loan Amount">

            <input id="loan_tenure" placeholder="Loan Tenure (Months)">

            <input id="interest_rate" placeholder="Interest Rate %">

            <input id="credit_score" placeholder="Credit Score">

            <input id="existing_loans" placeholder="Existing Loans">

            <input id="dti" placeholder="DTI Ratio">

            <input id="ltv" placeholder="LTV Ratio">

            <input id="savings" placeholder="Savings Balance">

            <input id="bureau" placeholder="Bureau Enquiries">

            <input id="missed" placeholder="Missed Payments">

            <select id="collateral">
                <option>Yes</option>
                <option>No</option>
            </select>
            <select id="co_applicant">
    <option value="1">Co-Applicant Available</option>
    <option value="0">No Co-Applicant</option>
</select>

<select id="nominee">
    <option value="1">Nominee Available</option>
    <option value="0">No Nominee</option>
</select>
        </div>

        <button onclick="predictRisk()">
            Evaluate Application
        </button>

    </div>

    <div class="card">

        <h2>Decision Result</h2>

        <div id="output">
            Waiting for underwriting decision...
        </div>

    </div>

    <div class="card">

        <h2>Risk Explanations</h2>

        <div id="reasons"></div>

    </div>

</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>

</body>
</html>
